version: "3.8"
services:
  menu-card:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - ./:/usr/src/app:cached
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: pnpm --filter @workspace/menu-card dev -- --host 0.0.0.0
    tty: true
